<section id="qa-test-results" data-viz-composition aria-labelledby="qa-results-title">
  <style>
    #qa-test-results {
      display: grid;
      gap: calc(var(--font-size-base) * 1.25);
      color: var(--foreground);
    }

    #qa-test-results .qa-heading {
      display: grid;
      gap: calc(var(--font-size-base) * 0.4);
    }

    #qa-test-results .qa-chart-layout {
      display: grid;
      grid-template-columns: minmax(220px, 0.8fr) minmax(280px, 1.2fr);
      align-items: center;
      gap: calc(var(--font-size-base) * 2);
    }

    #qa-test-results .qa-donut-wrap {
      position: relative;
      width: min(100%, 280px);
      aspect-ratio: 1;
      justify-self: center;
    }

    #qa-test-results .qa-donut {
      width: 100%;
      height: 100%;
      transform: rotate(-90deg);
    }

    #qa-test-results .qa-track {
      fill: none;
      stroke: var(--muted);
      stroke-width: 14;
    }

    #qa-test-results .qa-value {
      fill: none;
      stroke: var(--viz-series-1);
      stroke-width: 14;
      stroke-linecap: round;
      stroke-dasharray: 276.46 276.46;
    }

    #qa-test-results .qa-center {
      position: absolute;
      inset: 0;
      display: grid;
      place-content: center;
      text-align: center;
      gap: calc(var(--font-size-base) * 0.2);
    }

    #qa-test-results .qa-percent {
      font-size: calc(var(--font-size-base) * 2.4);
      font-weight: 500;
    }

    #qa-test-results .qa-details {
      display: grid;
      gap: calc(var(--font-size-base) * 1.1);
    }

    #qa-test-results .qa-result-row {
      display: grid;
      grid-template-columns: auto 1fr auto;
      align-items: center;
      gap: calc(var(--font-size-base) * 0.75);
    }

    #qa-test-results .qa-dot {
      width: calc(var(--font-size-base) * 0.75);
      height: calc(var(--font-size-base) * 0.75);
      border-radius: 50%;
      background: var(--viz-series-1);
    }

    #qa-test-results .qa-dot-muted {
      background: var(--muted-foreground);
    }

    #qa-test-results .qa-count {
      font-weight: 500;
    }

    #qa-test-results .qa-progress-label {
      display: flex;
      justify-content: space-between;
      gap: calc(var(--font-size-base) * 0.5);
    }

    @media (max-width: 620px) {
      #qa-test-results .qa-chart-layout {
        grid-template-columns: 1fr;
      }
    }
  </style>

  <div class="qa-heading">
    <h1 id="qa-results-title">Resultados de pruebas funcionales</h1>
    <p class="text-muted">Casos TC-01 a TC-17 · Ejecución formal del 15 de noviembre de 2026</p>
  </div>

  <div class="qa-chart-layout">
    <div class="qa-donut-wrap" role="img" aria-label="17 de 17 casos de prueba aprobados, equivalentes al 100 por ciento">
      <svg class="qa-donut" viewBox="0 0 120 120" aria-hidden="true">
        <circle class="qa-track" cx="60" cy="60" r="44"></circle>
        <circle class="qa-value" cx="60" cy="60" r="44"></circle>
      </svg>
      <div class="qa-center">
        <span class="qa-percent tabular-nums">100%</span>
        <span class="text-muted">17 de 17</span>
      </div>
    </div>

    <div class="qa-details">
      <h2>Resultado general: APROBADO</h2>

      <div class="qa-result-row">
        <span class="qa-dot" aria-hidden="true"></span>
        <span>Casos aprobados</span>
        <span class="qa-count tabular-nums">17</span>
      </div>

      <div class="qa-result-row">
        <span class="qa-dot qa-dot-muted" aria-hidden="true"></span>
        <span>Casos fallidos</span>
        <span class="qa-count tabular-nums">0</span>
      </div>

      <hr>

      <div class="qa-progress-label">
        <span>Cobertura ejecutada</span>
        <span class="qa-count tabular-nums">17/17 TC</span>
      </div>
      <div class="progress" role="progressbar" aria-label="Cobertura ejecutada" aria-valuenow="17" aria-valuemin="0" aria-valuemax="17">
        <div class="progress-bar" style="width: 100%"></div>
      </div>

      <p class="text-small text-muted">Fuente: resultados registrados en INDICE.md y resultados-ejecucion.json.</p>
    </div>
  </div>
</section>
